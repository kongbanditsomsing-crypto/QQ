<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head><body class="bg-[#313338] text-[#dbdee1] h-screen flex overflow-hidden font-sans">
    <div id="loginScreen" class="fixed inset-0 bg-[#313338] z-50 flex items-center justify-center">
        <div class="bg-[#2b2d31] p-8 rounded-lg shadow-2xl w-[440px] text-center">
            <h2 class="text-white text-2xl font-bold mb-2">Welcome back!</h2>
            <p class="text-[#949ba4] text-sm mb-6">We're so excited to see you again!</p>
            <input type="password" id="tokenInput" placeholder="Enter Bot Token" class="w-full bg-[#1e1f22] border border-[#111214] rounded p-3 text-white outline-none mb-4">
            <button onclick="login()" class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-medium p-3 rounded transition">Log In</button>
            <p id="errorMsg" class="text-[#ed4245] text-sm mt-4"></p>
        </div>
    </div>

    <div id="app" class="flex w-full h-full hidden">
        <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 shrink-0 overflow-y-auto" id="guildList"></div>
        <div class="w-60 bg-[#2b2d31] flex flex-col shrink-0">
            <div class="h-12 border-b border-[#1f2023] px-4 flex items-center font-bold text-white shadow-sm" id="serverName">Discord Clone</div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4" id="categoryList"></div>
            <div class="h-[52px] bg-[#232428] px-2 flex items-center gap-2">
                <img id="userAvatar" class="w-8 h-8 rounded-full">
                <div class="flex flex-col"><span id="userName" class="text-white text-sm font-semibold">User</span><span id="userTag" class="text-[#949ba4] text-xs">#0000</span></div>
            </div>
        </div>
        <div class="flex-1 flex flex-col bg-[#313338]">
            <div class="h-12 border-b border-[#1f2023] px-4 flex items-center font-bold text-white shadow-sm" id="chatHeader"># select-a-channel</div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messagesList"></div>
            <div class="p-4">
                <div class="bg-[#383a40] rounded-lg px-4 py-2.5">
                    <input type="text" id="msgInput" placeholder="Message #channel" class="w-full bg-transparent text-[#dbdee1] outline-none" onkeypress="handleEnter(event)">
                </div>
            </div>
        </div>
        <div class="w-60 bg-[#2b2d31] flex flex-col shrink-0 border-l border-[#1f2023]">
            <div class="p-4 font-bold text-xs text-[#949ba4] uppercase" id="memberCount">Members</div>
            <div class="flex-1 overflow-y-auto px-2 space-y-1" id="membersList"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
