<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web UI</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h2>Discord Web Client</h2>
            <p style="color:#b9bbbe; font-size:14px;">ใส่ Bot Token เพื่อเริ่มต้นใช้งาน</p>
            <input type="password" id="tokenInput" placeholder="Paste Bot Token here...">
            <button onclick="login()">Log In</button>
            <p id="errorMsg" style="color: #ed4245; font-size: 14px; margin-top:16px;"></p>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <!-- Guilds Sidebar -->
        <div class="guilds" id="guildList"></div>

        <!-- Channels & Categories Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header" id="serverName">Discord Web</div>
            
            <div id="voicePanel" class="voice-panel hidden">
                <div>
                    <div style="font-size:10px; color:#949ba4;">VOICE CONNECTED</div>
                    <div class="voice-status" id="vcChannelName">Voice Channel</div>
                </div>
                <button class="disconnect-btn" onclick="leaveVC()">Leave</button>
            </div>

            <div class="channels-container" id="categoryList"></div>

            <div class="user-panel">
                <img id="userAvatar" src="">
                <div style="display:flex; flex-direction:column;">
                    <span id="userName" style="color:#fff; font-weight:600; font-size:14px;">Bot</span>
                    <span id="userTag" style="color:#949ba4; font-size:12px;">#0000</span>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader"># Select a channel</div>
            <div class="messages" id="messagesList"></div>
            <div class="chat-input">
                <div class="chat-input-wrapper">
                    <input type="text" id="msgInput" placeholder="Message..." onkeypress="handleEnter(event)">
                </div>
            </div>
        </div>

        <!-- Right Panel: Soundboard & Member List -->
        <div class="right-sidebar">
            <div class="sidebar-section">
                <div class="section-title">🔊 Soundboard (กระดานเสียง)</div>
                <div class="soundboard-grid" id="soundboardGrid"></div>
            </div>
            <div class="sidebar-section" style="flex:1; overflow-y:auto;">
                <div class="section-title" id="memberCount">MEMBERS</div>
                <div id="membersList"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
